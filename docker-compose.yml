# Infra local — Cap. 3 (Postgres 15 + Redis)
# Cloudflare R2 é externo (Cap. 3.3) — não requer serviço local.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: filitech
      POSTGRES_PASSWORD: filitech_dev
      POSTGRES_DB: filitech_erp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filitech"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
