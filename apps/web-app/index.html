<!doctype html>
<html lang="pt-BR">

  <body class="bg-zinc-950">

      // Registra o Service Worker (Cap. 8.3) — Background Sync de vendas offline.

        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/service-worker.js");
        });
      }
    </script>
  </body>
</html>
